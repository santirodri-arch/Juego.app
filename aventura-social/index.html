":"transporte"},{"n":7,"type":"vf","q":"Los servicios públicos satisfacen las necesidades básicas.","opts":["Verdadero","Falso"],"a":0,"info":"El agua potable, el alcantarillado y otros servicios públicos ayudan a atender necesidades de la población.","hint":"Piensa en los servicios que necesitas todos los días en tu comunidad.","scene":"servicios"},{"n":8,"type":"vf","q":"La provincia es la división territorial y política del Ecuador formada por cantones.","opts":["Verdadero","Falso"],"a":0,"info":"El territorio ecuatoriano se divide en provincias, y cada provincia se organiza en cantones.","hint":"Recuerda las divisiones territoriales que estudiaste.","scene":"mapa"},{"n":9,"type":"opcion_multiple","q":"¿Qué es la provincia?","opts":["Un barrio","Es la división territorial y política del Ecuador formada por cantones","Un país"],"a":1,"info":"Una provincia es una división territorial y política del Ecuador formada por cantones.","hint":"Piensa en la diferencia entre un barrio, una provincia y un país.","scene":"mapa"},{"n":10,"type":"opcion_multiple","q":"¿Cómo se llama la ciudad importante de cada provincia?","opts":["Parroquia","Capital","Cantón"],"a":1,"info":"La capital es la ciudad donde se encuentran las principales instituciones provinciales.","hint":"Recuerda cómo llamamos a la ciudad sede de las autoridades provinciales.","scene":"capital"},{"n":11,"type":"opcion_multiple","q":"¿Por qué es importante la capital de la provincia?","opts":["Por su cantidad de habitantes y servicios públicos","Porque no tiene gente","Porque no tiene servicios"],"a":0,"info":"En el cuestionario se destaca la concentración de habitantes y servicios públicos en la capital.","hint":"Piensa en los servicios que suelen encontrarse en las ciudades principales.","scene":"capital"},{"n":12,"type":"opcion_multiple","q":"¿Quiénes participan en el Consejo Provincial?","opts":["El prefecto y viceprefectos","Solo los estudiantes","Solo el gobernador"],"a":0,"info":"En el cuestionario se marca la opción A. El consejo provincial incluye al prefecto y al viceprefecto, junto con otras autoridades y representantes cantonales y parroquiales.","hint":"Piensa en qué autoridades trabajan en el gobierno provincial.","scene":"autoridad"},{"n":13,"type":"opcion_multiple","q":"¿Para qué sirven los medios de transporte del cantón y la provincia?","opts":["Para que las personas se movilicen de un lugar a otro, vayan a su trabajo y a la escuela","Para dormir","Para no moverse"],"a":0,"info":"El transporte ayuda a llegar a la escuela, al trabajo, a los centros de salud y a otros lugares.","hint":"Recuerda los viajes que hacemos por caminos, carreteras o ríos.","scene":"transporte"},{"n":14,"type":"opcion_multiple","q":"¿Qué son los servicios públicos?","opts":["Los que satisfacen las necesidades básicas y se encargan de nuestra seguridad","Los que no sirven","Los que son privados"],"a":0,"info":"Los servicios públicos atienden necesidades de la población, como el agua, el saneamiento y la seguridad.","hint":"Piensa en los servicios que hacen posible una vida segura y saludable.","scene":"servicios"},{"n":15,"type":"opcion_multiple","q":"¿Cuáles son ejemplos de servicios públicos según el cuaderno?","opts":["Agua potable y alcantarillado","Juguetes y videojuegos","Ropa de marca"],"a":0,"info":"El agua potable y el alcantarillado son ejemplos de servicios públicos que ayudan a la salud y el bienestar.","hint":"Piensa en los servicios relacionados con el agua y la higiene.","scene":"agua"}];

 const bus=(x,y)=>`<g transform="translate(${x} ${y})"><rect x="-128" y="-90" width="256" height="115" rx="24" fill="#ffc761"/><rect x="-104" y="-70" width="61" height="57" rx="7" fill="#84d3d6"/><rect x="-33" y="-70" width="65" height="57" rx="7" fill="#84d3d6"/><rect x="45" y="-70" width="65" height="57" rx="7" fill="#84d3d6"/><rect x="-90" y="9" width="180" height="10" rx="5" fill="#d9874d"/><circle cx="-71" cy="27" r="27" fill="#234753"/><circle cx="77" cy="27" r="27" fill="#234753"/><circle cx="-71" cy="27" r="10" fill="#dceee2"/><circle cx="77" cy="27" r="10" fill="#dceee2"/></g>`;
 const tap=(x,y)=>`<g transform="translate(${x} ${y})"><path d="M-20 20H15V-45H85" fill="none" stroke="#597f8d" stroke-width="22" stroke-linejoin="round" stroke-linecap="round"/><rect x="67" y="-60" width="62" height="24" rx="12" fill="#78929d"/><path d="M85 -79H110 M98 -104V-53" stroke="#627987" stroke-width="11" stroke-linecap="round"/><path d="M97 0Q123 37 97 51Q71 37 97 0Z" fill="#72cbe4"/></g>`;
 const map='<g transform="translate(350 188) rotate(-8)"><path d="M-95 -84L-36 -121L18 -116L48 -83L90 -77L104 -38L68 -9L92 29L55 55L36 102L-19 119L-47 84L-106 67L-95 17L-135 -15L-98 -43Z" fill="#ffce70" stroke="#fff5d7" stroke-width="9" stroke-linejoin="round"/><path d="M-81 -27L-20 -66L27 -38L49 6L8 39L-31 18L-80 44" stroke="#e5a65f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 8" fill="none"/><circle cx="8" cy="-7" r="13" fill="#267b82"/></g>';
 let extra=''; let label='Conoce tu Ecuador';
 if(scene==='intro'){extra=`${map}${house(115,365,1.35)}${house(584,357,1.15,'#ffe9b9')}${flag(490,343,1.1)}${cloud(116,89,1.1)}${cloud(562,92,.8)}`;label='¡Viaja por las provincias!'}
 if(scene==='mapa'){extra=`${map}${flag(524,350,.9)}${house(142,363,1.25)}${cloud(544,88,1.1)}`;label='Provincias y cantones'}
 if(scene==='identidad'){extra=`${person(235,337)}${person(336,340,'#a76e4f')}${person(440,337,'#e2ad7d')}${flag(510,337,.9)}${cloud(125,95)}`;label='Cultura e identidad'}
 if(scene==='autoridad'){extra=`${building(352,368,1.15)}${flag(560,349,.95)}${cloud(126,85,1.1)}`;label='Autoridades provinciales'}
 if(scene==='rural'){extra=`${house(180,339,1.18)}${building(536,346,.65)}<path d="M0 370Q230 305 415 370" stroke="#dbdc78" stroke-width="7" stroke-dasharray="18 19" fill="none"/>${cloud(405,88,1.1)}`;label='Ciudad y campo'}
 if(scene==='transporte'){extra=`<path d="M0 349 Q250 298 700 346V420H0Z" fill="#e2d3a2"/>${bus(360,312)}${house(122,288,.82)}${cloud(535,95,1)}`;label='Conectamos comunidades'}
 if(scene==='servicios'){extra=`${building(188,347,.78)}${tap(365,276)}${house(584,352,.9)}${cloud(135,96,.85)}`;label='Servicios para todos'}
 if(scene==='capital'){extra=`${house(145,348,1.1)}${building(430,357,.99)}${flag(572,339,.9)}${cloud(420,88,1)}`;label='Conoce las capitales'}
 if(scene==='agua'){extra=`${tap(292,241)}${house(563,360,1.1)}${cloud(190,85,.9)}<path d="M0 354 Q180 328 360 364T700 356" stroke="#b6eaf0" stroke-width="19" fill="none"/>`;label='Agua y alcantarillado'}
 return `<svg viewBox="0 0 700 420" role="img" aria-label="Ilustración de ${escapeHTML(label)}" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="sky" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#85d8d4"/><stop offset="1" stop-color="#eef2c6"/></linearGradient></defs><rect width="700" height="420" fill="url(#sky)"/><circle cx="579" cy="93" r="46" fill="#ffe3a0" opacity=".9"/>${hill}<path d="M0 404Q250 374 470 407T700 402V420H0" fill="#216e78"/>${extra}<g fill="#fff6d5" opacity=".8"><circle cx="68" cy="187" r="4"/><circle cx="650" cy="194" r="5"/><circle cx="420" cy="63" r="4"/></g></svg>`;
}
const modeText=m=>m==='evaluacion'?'Modo evaluación':'Modo aprender';
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.remove('hidden');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.add('hidden'),3000)}
function refreshTools(){document.getElementById('effectsBtn').textContent=state.effects?'🔊 Efectos: sí':'🔇 Efectos: no';document.getElementById('effectsBtn').setAttribute('aria-pressed',String(state.effects));document.getElementById('musicBtn').textContent=state.music?'🎵 Música: sí':'🎵 Música: no';document.getElementById('musicBtn').setAttribute('aria-pressed',String(state.music));let rec=getBest();const el=document.getElementById('record');el.classList.toggle('hidden',!rec);el.textContent=`🏆 Mejor nota: ${rec.toFixed(1)}/10`}
function sound(freq=560,dur=.095,volume=.065){if(!state.effects)return;try{const ctx=audio();if(!ctx)return;const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=freq;g.gain.setValueAtTime(volume,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+dur);o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+dur)}catch(e){}}
function audio(){try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;if(!state.soundCtx)state.soundCtx=new C();if(state.soundCtx.state==='suspended')state.soundCtx.resume();return state.soundCtx}catch(e){return null}}
function musicOff(){clearInterval(state.musicLoop);state.musicLoop=null;state.music=false;refreshTools()}
function musicOn(){const ctx=audio();if(!ctx){toast('La música no está disponible en este navegador.');return}state.music=true;let p=0;const notes=[261.6,329.6,392,440,392,329.6,293.7,349.2];const play=()=>{if(!state.music)return;let now=ctx.currentTime;const osc=ctx.createOscillator(),gn=ctx.createGain();osc.type='sine';osc.frequency.value=notes[p++%notes.length];gn.gain.setValueAtTime(.0001,now);gn.gain.exponentialRampToValueAtTime(.018,now+.045);gn.gain.exponentialRampToValueAtTime(.0001,now+.52);osc.connect(gn);gn.connect(ctx.destination);osc.start(now);osc.stop(now+.56)};play();state.musicLoop=setInterval(play,630);refreshTools()}
function speak(){if(!('speechSynthesis'in window)){toast('Este navegador no permite leer preguntas en voz alta.');return}try{speechSynthesis.cancel();const q=state.pool[state.idx];const u=new SpeechSynthesisUtterance(q.q);u.lang='es-EC';u.rate=.86;u.pitch=1;u.volume=1;speechSynthesis.speak(u)}catch(e){toast('No se pudo activar la voz en este dispositivo.')}}
function home(){state.screen='home';state.review=false;state.pool=[];state.idx=0;state.selected=null;try{speechSynthesis.cancel()}catch(e){};render()}
function renderHome(){return `<section class="hero"><div><span class="kicker">🌎 15 desafíos · 4.º de Educación Básica</span><h1 class="big-title">¡Descubre<br><em>mi Ecuador!</em></h1><p class="lead">Explora las provincias, sus autoridades, los medios de transporte y los servicios públicos. Aprende jugando y consigue estrellas en cada estación.</p><label class="label" for="studentName">Nombre del explorador o exploradora</label><input class="name" id="studentName" maxlength="45" autocomplete="off" placeholder="Escribe tu nombre (opcional)" value="${escapeHTML(state.name)}"><div class="mode-grid" role="group" aria-label="Modo de juego"><button class="mode ${state.mode==='aprender'?'active':''}" id="learnBtn" type="button" aria-pressed="${state.mode==='aprender'}"><b>🧠 Modo aprender <span class="mark">${state.mode==='aprender'?'●':'○'}</span></b><small>Pistas, respuestas y explicaciones para estudiar.</small></button><button class="mode ${state.mode==='evaluacion'?'active':''}" id="examBtn" type="button" aria-pressed="${state.mode==='evaluacion'}"><b>🏅 Modo evaluación <span class="mark">${state.mode==='evaluacion'?'●':'○'}</span></b><small>Sin pistas. La nota aparece al finalizar.</small></button></div><div class="hero-actions"><button class="btn btn-primary" id="startBtn" type="button">▶ Comenzar aventura</button></div><div class="micro">✅ 8 preguntas de verdadero o falso &nbsp; · &nbsp; ✅ 7 de selección múltiple<br>✅ Calificación sobre 10 &nbsp; · &nbsp; ✅ Disponible sin Internet</div></div><div class="hero-visual"><div class="art-frame">${drawing('intro')}</div><div class="float float-a">🇪🇨 ¡Conoce tu país!</div><div class="float float-b">⭐ ¡15 retos para superar!</div></div></section><section class="how"><h2 class="section-title">¿Cómo se juega?</h2><div class="how-grid"><article class="how-card"><div class="how-icon">🗺️</div><h3>1. Recorre 15 estaciones</h3><p>Responde preguntas sobre las provincias, las capitales y la vida en comunidad.</p></article><article class="how-card"><div class="how-icon">💡</div><h3>2. Aprende con cada respuesta</h3><p>En el modo aprender, recibirás explicaciones sencillas y pistas opcionales.</p></article><article class="how-card"><div class="how-icon">🏆</div><h3>3. Descubre tu resultado</h3><p>Conoce tu calificación y repasa las preguntas que necesitas practicar.</p></article></div></section>`}
function begin(review=false){state.review=review;state.screen='quiz';state.idx=0;state.selected=null;state.hint=false;state.responses=[];state.pool=review?state.basePool.filter((q,i)=>!state.baseResponses[i]?.correct):QUESTIONS.slice();if(!review){state.baseResponses=[];state.basePool=QUESTIONS.slice()}if(!state.pool.length){toast('¡No tienes errores para repasar!');home();return}try{speechSynthesis.cancel()}catch(e){};render()}
function renderQuiz(){let q=state.pool[state.idx],len=state.pool.length,n=state.idx, answered=state.selected!==null,correct=answered&&state.selected===q.a,evalMode=state.mode==='evaluacion'&&!state.review;let responses=state.responses;const status=(i)=>i===n?'current':i<n?(responses[i]?.correct?'done':'wrong'):'';return `<section class="panel"><div class="panel-header"><div class="panel-top"><div><span class="eyebrow">${state.review?'Repaso personalizado':modeText(state.mode)}</span><h2>${state.review?'Practica las preguntas difíciles':'Ruta por mi Ecuador'}</h2></div><span class="chip yellow">⭐ ${responses.filter(r=>r.correct).length} de ${len} estrellas</span></div><div class="meter" role="progressbar" aria-label="Avance del juego" aria-valuenow="${n+1}" aria-valuemin="0" aria-valuemax="${len}"><div class="meter-fill" style="width:${(n+1)/len*100}%"></div></div><div class="step-row" aria-label="Preguntas completadas">${state.pool.map((_,i)=>`<span class="dot ${status(i)}" title="Estación ${i+1}">${i===n?'★':i<n?'✓':''}</span>`).join('')}</div></div><div class="question-layout"><div class="q-main"><div class="qnum">Estación ${n+1} de ${len} · Pregunta ${q.n} del cuestionario</div><h1>${escapeHTML(q.q)}</h1><div class="question-tools"><span class="chip">${q.type==='vf'?'✔️ Verdadero o falso':'🔎 Selección múltiple'}</span><button class="chip-action" id="speakBtn" type="button">🔈 Escuchar pregunta</button>${!evalMode&&!answered?'<button class="chip-action" id="hintBtn" type="button">💡 Ver pista</button>':''}</div>${state.hint&&!answered&&!evalMode?`<div class="hint">💡 ${escapeHTML(q.hint)}</div>`:''}<div class="answers" role="group" aria-label="Opciones de respuesta">${q.opts.map((op,i)=>{let cls='';if(answered&&!evalMode){cls=i===q.a?'right':i===state.selected?'wrong':'frozen'}else if(answered&&evalMode){cls=i===state.selected?'picked':'frozen'}return `<button class="answer ${cls}" type="button" data-opt="${i}" ${answered?'disabled':''} aria-label="${q.type==='vf'?'':String.fromCharCode(65+i)+'. '}${escapeHTML(op)}"><span class="letter">${q.type==='vf'?(i===0?'V':'F'):String.fromCharCode(65+i)}</span><span class="wording">${escapeHTML(op)}</span></button>`}).join('')}</div>${answered?(evalMode?'<div class="feedback neutral"><b>✍️ Respuesta registrada</b><p>Continúa hasta terminar para conocer tus aciertos y tu nota.</p></div>':`<div class="feedback ${correct?'':'bad'}" role="status"><b>${correct?'🌟 ¡Muy bien! Ganaste una estrella.':'💡 ¡Buen intento! Aprendamos juntos.'}</b><p>${escapeHTML(q.info)}</p><p><b>Respuesta correcta: ${escapeHTML(ansText(q,q.a))}</b></p></div>`):''}<div class="question-actions"><span class="note">${answered?'Puedes continuar a la siguiente estación.':'Selecciona la opción que consideres correcta.'}</span>${answered?`<button class="btn btn-primary" id="nextBtn" type="button">${n===len-1?'🏆 Ver mis resultados':'Siguiente estación →'}</button>`:'<button class="btn btn-secondary btn-small" id="exitBtn" type="button">Volver al inicio</button>'}</div></div><div class="q-art"><figure style="margin:0">${drawing(q.scene)}<figcaption>🌎 ${sceneTitle(q.scene)}</figcaption></figure><div class="note" style="padding:13px 16px">${state.review?'Repaso de tus respuestas anteriores':evalMode?'Guarda tus respuestas para ver tu nota final':'Lee la pregunta, piensa y aprende con calma'}</div></div></div></section>`}
function sceneTitle(scene){return ({mapa:'Explorando las provincias',identidad:'Nuestra cultura e identidad',autoridad:'Autoridades de Ecuador',rural:'La ciudad y el campo',transporte:'Caminos y transporte',servicios:'Servicios públicos',capital:'Las capitales provinciales',agua:'Agua para la comunidad'})[scene]||'Ecuador'}
function selectAnswer(i){if(state.selected!==null||!state.pool[state.idx]||i<0||i>=state.pool[state.idx].opts.length)return;let q=state.pool[state.idx];state.selected=i;state.responses[state.idx]={chosen:i,correct:i===q.a};sound(i===q.a?740:260,.16);if(i===q.a){setTimeout(()=>sound(1046,.09),90)}render()}
function next(){if(state.selected===null)return;try{speechSynthesis.cancel()}catch(e){};if(state.idx<state.pool.length-1){state.idx++;state.selected=null;state.hint=false;render();scrollTop()}else{if(!state.review){state.baseResponses=state.responses.slice();state.basePool=state.pool.slice()}state.screen='result';if(!state.review){let note=(state.responses.filter(r=>r.correct).length/15)*10;saveBest(Number(note.toFixed(1)))}if(state.responses.filter(r=>r.correct).length>=state.pool.length*.8)confetti();render();scrollTop()}}
function scrollTop(){try{window.scrollTo({top:0,behavior:'smooth'})}catch(e){}}
function renderResults(){const original=state.review?state.baseResponses:state.responses;const pool=state.review?state.basePool:state.pool;const correct=original.filter(r=>r.correct).length;const wrong=pool.length-correct;const score=(correct/pool.length*10).toFixed(1);const errors=pool.map((q,i)=>({q,r:original[i]})).filter(x=>!x.r?.correct);let title=Number(score)>=9?'¡Eres un gran explorador!':Number(score)>=7?'¡Muy buen recorrido!':'¡Cada intento te hace aprender!';const reviewCorrect=state.responses.filter(r=>r.correct).length;return `<section class="panel"><div class="results"><div class="medal" aria-hidden="true">${Number(score)>=9?'🏆':Number(score)>=7?'🥇':'🧭'}</div><span class="eyebrow">${state.review?'Terminaste el repaso':'Aventura completada'}</span><h1>${title}</h1><p class="subline">${state.name?`¡Buen trabajo, <strong>${escapeHTML(state.name)}</strong>! `:''}Has explorado el Ecuador y practicado conocimientos sobre provincias, autoridades y servicios públicos.</p><div class="result-score" aria-label="Calificación ${score} sobre 10"><strong>${score}</strong><span>/10</span></div><div class="stats"><div class="stat"><b>${correct}</b><small>Aciertos originales</small></div><div class="stat"><b>${wrong}</b><small>Para repasar</small></div><div class="stat"><b>${pool.length}</b><small>Preguntas</small></div></div>${state.review?`<p class="subline">En este repaso acertaste <b>${reviewCorrect} de ${state.pool.length}</b> preguntas. La calificación mostrada corresponde a la evaluación original.</p>`:''}<p class="subline">${wrong?'Repasa las preguntas difíciles y vuelve a intentarlo. ¡Puedes mejorar!':'¡Felicitaciones! Has respondido correctamente todas las preguntas.'}</p><div class="results-actions">${wrong?'<button class="btn btn-primary" id="reviewBtn" type="button">🔄 Repasar errores</button>':''}<button class="btn btn-secondary" id="againBtn" type="button">↻ Jugar de nuevo</button><button class="btn btn-ghost" style="color:#24565a;border-color:#b6d4cc" id="shareBtn" type="button">📋 Copiar resultado</button></div><details class="list-errors" ${wrong?'':'style="display:none"'}><summary>📚 Ver ${wrong} pregunta${wrong===1?'':'s'} para estudiar</summary>${errors.map(({q,r})=>`<article class="error"><b>Pregunta ${q.n}. ${escapeHTML(q.q)}</b><div class="chosen">Tu respuesta: ${escapeHTML(ansText(q,r?.chosen))}</div><div class="correct">Respuesta correcta: ${escapeHTML(ansText(q,q.a))}</div><div>${escapeHTML(q.info)}</div></article>`).join('')}</details><div class="results-footer">Calificación: (aciertos ÷ 15) × 10. En el repaso se conserva la nota original.</div></div></section>`}
function render(){refreshTools();app.innerHTML=state.screen==='home'?renderHome():state.screen==='quiz'?renderQuiz():renderResults();if(state.screen==='home'){document.getElementById('studentName').addEventListener('input',e=>state.name=e.target.value.slice(0,45));document.getElementById('learnBtn').onclick=()=>{state.mode='aprender';render()};document.getElementById('examBtn').onclick=()=>{state.mode='evaluacion';render()};document.getElementById('startBtn').onclick=()=>{state.name=document.getElementById('studentName').value.trim().slice(0,45);begin(false)}}else if(state.screen==='quiz'){document.getElementById('speakBtn').onclick=speak;const hb=document.getElementById('hintBtn');if(hb)hb.onclick=()=>{state.hint=!state.hint;render()};app.querySelectorAll('[data-opt]').forEach(b=>b.onclick=()=>selectAnswer(Number(b.dataset.opt)));const nextBtn=document.getElementById('nextBtn');if(nextBtn)nextBtn.onclick=next;const exitBtn=document.getElementById('exitBtn');if(exitBtn)exitBtn.onclick=()=>{if(confirm('¿Quieres regresar al inicio? Se perderá el avance de este recorrido.'))home()}}else{const rev=document.getElementById('reviewBtn');if(rev)rev.onclick=()=>begin(true);document.getElementById('againBtn').onclick=()=>{state.review=false;home()};document.getElementById('shareBtn').onclick=()=>{const total=state.baseResponses.length?state.baseResponses:state.responses;const n=total.filter(r=>r.correct).length;const msg=`🌎 Aventura Social · Estudios Sociales 4.º EGB\n${state.name?state.name+'\n':''}Resultado: ${(n/15*10).toFixed(1)}/10 (${n}/15 aciertos)\n¡Sigue explorando Ecuador!`;if(navigator.clipboard?.writeText){navigator.clipboard.writeText(msg).then(()=>toast('Resultado copiado. Puedes pegarlo en WhatsApp.')).catch(()=>copyFallback(msg))}else copyFallback(msg)}}}
function copyFallback(text){let t=document.createElement('textarea');t.value=text;document.body.appendChild(t);t.select();try{document.execCommand('copy');toast('Resultado copiado.')}catch(e){toast('Puedes seleccionar y copiar tu resultado manualmente.')}t.remove()}
function confetti(){const container=document.getElementById('confetti');container.innerHTML='';const colors=['#ffd36e','#8cddba','#e6a2a6','#c5eaf3','#ffffff'];for(let i=0;i<52;i++){let e=document.createElement('i');e.style.left=(Math.random()*100)+'%';e.style.background=colors[i%colors.length];e.style.animationDelay=(Math.random()*1.3)+'s';e.style.transform=`rotate(${Math.random()*90}deg)`;container.appendChild(e)}setTimeout(()=>container.innerHTML='',4500)}
document.getElementById('effectsBtn').onclick=()=>{state.effects=!state.effects;refreshTools();if(state.effects)sound()};
document.getElementById('musicBtn').onclick=()=>state.music?musicOff():musicOn();
document.addEventListener('keydown',ev=>{if(state.screen!=='quiz'||ev.altKey||ev.ctrlKey||ev.metaKey||['INPUT','TEXTAREA'].includes(document.activeElement?.tagName))return;let q=state.pool[state.idx];if(state.selected===null){let n=Number(ev.key);if(n>=1&&n<=q.opts.length)selectAnswer(n-1);if(q.type==='vf'){if(ev.key.toLowerCase()==='v')selectAnswer(0);if(ev.key.toLowerCase()==='f')selectAnswer(1)}}else if(ev.key==='Enter')next()});
window.addEventListener('pagehide',()=>{musicOff();try{speechSynthesis.cancel()}catch(e){}});
render();
</script>
</body></html>
