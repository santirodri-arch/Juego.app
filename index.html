const PREGUNTAS = [
  {n:1,topic:'Plantas sin semilla',scene:'spores',q:'¿Cómo se reproducen las plantas sin semilla, como los musgos y los helechos?',opts:['Mediante semillas.','Mediante esporas.','Mediante frutos.'],a:1,info:'Los musgos y los helechos son ejemplos de plantas sin semilla. Se reproducen por esporas, no por semillas.',hint:'Piensa en cómo un helecho forma plantas nuevas aunque no tenga frutos.'},
  {n:2,topic:'Lugares donde viven',scene:'habitat',q:'¿En qué lugares se encuentran principalmente las plantas sin semilla del Ecuador?',opts:['En zonas secas con poca sombra.','En desiertos con suelo arenoso.','En lugares húmedos, frescos y con sombra.'],a:2,info:'Los musgos y muchos helechos crecen en lugares húmedos y frescos, como bosques nublados, páramos y riberas de ríos.',hint:'Recuerda cómo se siente una roca cubierta de musgo después de la lluvia.'},
  {n:3,topic:'Biodiversidad del Ecuador',scene:'ecuador',q:'¿Por qué en Ecuador existen muchos hábitats para las plantas sin semilla?',opts:['Por la variedad de alturas y climas y su ubicación ecuatorial.','Porque todas las regiones tienen el mismo clima.','Porque únicamente hay plantas en la Costa.'],a:0,info:'La ubicación ecuatorial y las distintas altitudes, desde la Costa hasta los páramos, favorecen una variedad de climas y hábitats.',hint:'Compara el clima de la playa con el de las montañas andinas.'},
  {n:4,topic:'Línea equinoccial',scene:'equator',q:'¿Qué es la línea equinoccial que pasa por Ecuador?',opts:['Una cordillera que atraviesa los Andes.','Una línea imaginaria que divide la Tierra en norte y sur.','Un río que separa la Costa y la Sierra.'],a:1,info:'La línea equinoccial divide imaginariamente la Tierra en hemisferios norte y sur. Junto con lluvias y distintas altitudes, la ubicación del país favorece diversos ambientes para las plantas.',hint:'Piensa en un globo terráqueo y sus dos mitades.'},
  {n:6,topic:'Plantas epífitas',scene:'epiphytes',q:'¿Qué hacen las plantas epífitas, como algunos musgos y helechos?',opts:['Viven dentro del agua de los ríos.','Extraen el alimento del interior del árbol.','Crecen sobre troncos y ramas y usan al árbol como soporte.'],a:2,info:'Algunos musgos y helechos son epífitos: crecen sobre troncos o ramas sin quitarle alimento al árbol que los sostiene.',hint:'Imagina una pequeña planta apoyada en la rama de un árbol del bosque.'},
  {n:7,topic:'El ciclo del agua',scene:'water',q:'¿Cómo ayuda el ciclo del agua a las plantas sin semilla?',opts:['Aporta lluvia, neblina y humedad para que crezcan y se reproduzcan.','Hace que las plantas no necesiten humedad.','Convierte las esporas en semillas.'],a:0,info:'La lluvia, la neblina y la humedad ambiental favorecen el crecimiento de estas plantas y permiten que muchas completen su reproducción.',hint:'Recuerda qué sucede con los bosques cuando llega la lluvia.'},
  {n:8,topic:'Bosques de Papallacta',scene:'papallacta',q:'¿Qué caracteriza a los bosques de Papallacta, en Napo?',opts:['Son cálidos y casi sin humedad.','Son fríos y húmedos, con musgos y helechos.','Son desiertos sin vegetación.'],a:1,info:'En Papallacta hay ambientes de bosque nublado, frescos y húmedos, donde se encuentran numerosos musgos y helechos.',hint:'La neblina es frecuente en muchos bosques de montaña.'},
  {n:10,topic:'Especies endémicas',scene:'endemic',q:'¿Qué significa que una especie es endémica de un lugar?',opts:['Que vive naturalmente solo en ese lugar determinado.','Que llega cada año desde diferentes continentes.','Que crece naturalmente en todos los lugares del planeta.'],a:0,info:'Una especie endémica vive de forma natural únicamente en una región determinada. La variedad de montañas, valles y climas del Ecuador favorece estos hábitats particulares.',hint:'Piensa en especies que solo existen de manera natural en una región.'},
  {n:14,topic:'Cuidemos los bosques',scene:'deforestation',q:'¿Qué efecto produce la deforestación sobre las plantas sin semilla?',opts:['Aumenta los bosques húmedos.','Crea más sombra para los musgos.','Destruye su hábitat y reduce la humedad del ambiente.'],a:2,info:'Al talar o eliminar los bosques, se pierden los lugares donde viven muchas plantas y disminuye la sombra y la humedad que necesitan.',hint:'Imagina un bosque antes y después de cortar sus árboles.'},
  {n:15,topic:'Protección de la naturaleza',scene:'care',q:'¿Qué acción ayuda a proteger a las plantas sin semilla en Ecuador?',opts:['Dejar basura cerca de los ríos.','Cuidar los bosques y reforestar áreas dañadas.','Cortar los árboles de los bosques nublados.'],a:1,info:'Para conservar estas plantas, podemos cuidar los bosques, evitar la contaminación, no botar basura, reforestar y proteger los páramos.',hint:'Piensa en acciones que conservan los árboles, el agua y el suelo.'}

  const palette={intro:['#90d6c9','#e6eb9d','#4da785','#2d805b'],spores:['#9bdcce','#ddf4b6','#6ab979','#2e8255'],habitat:['#8bbfc2','#c9e7d4','#69a48a','#267452'],ecuador:['#8bcad8','#eaf5c3','#6bab84','#357456'],equator:['#99d6cc','#e6e6a2','#68ad8b','#337d60'],epiphytes:['#97d5c5','#dbeeba','#79ad7d','#39754c'],water:['#8bc9d6','#e4eeaf','#6fb0a1','#438769'],papallacta:['#a5ceda','#e7f0e5','#79b0a3','#467e74'],endemic:['#9ad2c9','#f3ebad','#6cb587','#347a58'],deforestation:['#e4cf9d','#f5e4ba','#bb9e72','#876445'],care:['#b0ddc2','#eff2b6','#82cba1','#418e68']}[type]||['#93d4c7','#ddefb0','#6dad8b','#377b5b'];
  let extra='';
  const fern=(x,y,scale=1)=>`<g transform="translate(${x} ${y}) scale(${scale})"><path d="M0 1 Q-2 -55 7 -116" fill="none" stroke="#155d43" stroke-width="6" stroke-linecap="round"/><g fill="#1c8558" stroke="#11603f" stroke-width="1">${[0,1,2,3,4,5,6,7].map((k)=>{let yy=-8-k*13;let xx=k%2===0?-1:1;return `<ellipse cx="${-17+k*.9}" cy="${yy}" rx="22" ry="8" transform="rotate(${-28+k*1.5} ${-17+k*.9} ${yy})"/><ellipse cx="${18-k*.6}" cy="${yy-6}" rx="22" ry="8" transform="rotate(${28-k*1.5} ${18-k*.6} ${yy-6})"/>`}).join('')}</g></g>`;
  const tree=(x,y,s=1)=>`<g transform="translate(${x} ${y}) scale(${s})"><path d="M0 0 Q-10 -85 5 -170" stroke="#6d6542" stroke-width="22" fill="none" stroke-linecap="round"/><path d="M4 -124 Q-17 -150 -36 -158" stroke="#6d6542" stroke-width="10" fill="none"/><circle cx="4" cy="-177" r="62" fill="#2b8760"/><circle cx="-32" cy="-163" r="39" fill="#45a16c"/><circle cx="40" cy="-156" r="40" fill="#3b9466"/><circle cx="-10" cy="-201" r="30" fill="#62b877"/></g>`;
  const cloud=(x,y,s=1,fill='#eafff4')=>`<g transform="translate(${x} ${y}) scale(${s})" opacity=".85" fill="${fill}"><ellipse cx="0" cy="0" rx="50" ry="19"/><circle cx="-19" cy="-15" r="28"/><circle cx="17" cy="-20" r="37"/></g>`;
  const drops=(x,y)=>`<g fill="#f5feff" opacity=".85">${[0,1,2,3,4,5].map((v)=>`<path d="M${x+v*30} ${y+(v%2)*12} l-7 16" stroke="#e2f9fe" stroke-width="5" stroke-linecap="round"/>`).join('')}</g>`;
  if(type==='intro')extra=`${tree(80,340,1.12)}${tree(620,345,.95)}${fern(178,355,1.25)}${fern(520,360,1.05)}${cloud(355,92,1.05)}<g><path d="M308 311q37-88 78-3" stroke="#d9e69c" fill="none" stroke-width="8" stroke-linecap="round"/><circle cx="345" cy="280" r="25" fill="#f6d979"/><circle cx="342" cy="277" r="5" fill="#7d5b39"/></g>`;
  if(type==='spores')extra=`${fern(240,363,1.9)}${fern(460,365,1.25)}${[0,1,2,3,4,5,6].map((k)=>`<circle cx="${260+k*34}" cy="${140+(k%3)*24}" r="${5+(k%2)*2}" fill="#f8d879" stroke="#d3a649" stroke-width="1"/>`).join('')}`;
  if(type==='habitat')extra=`${tree(120,366,.95)}${tree(535,362,1.2)}${fern(315,365,1.15)}${cloud(330,93,1.3)}${drops(254,129)}`;
  if(type==='ecuador')extra=`${cloud(150,65,.8)}<circle cx="550" cy="85" r="45" fill="#ffde78" opacity=".9"/>${tree(115,362,.68)}${fern(524,370,1.2)}<path d="M175 289 L263 150 L355 289 Z" fill="#9bb5aa"/><path d="M245 291 L357 125 L474 291 Z" fill="#688f8b"/><path d="M339 153L357 125L376 157Z" fill="#eef9eb"/>`;
  if(type==='equator')extra=`<g transform="translate(370 189)"><circle r="131" fill="#85cce4" stroke="#fff9cf" stroke-width="8"/><path d="M-111-47Q-68-106-18-75Q-37-32 15-15Q14 26-36 36Q-58 64-97 30Z" fill="#4ca375"/><path d="M36-91Q88-90 103-47L73-11 89 23 54 47 36 81 7 73 4 38 30 5 22-35Z" fill="#4ca375"/><ellipse rx="126" ry="36" fill="none" stroke="#f9da66" stroke-width="12" transform="rotate(-8)"/><path d="M0-124v248" stroke="#ffffff90" stroke-width="3" stroke-dasharray="9 9"/></g>`;
  if(type==='epiphytes')extra=`<g><path d="M330 387Q295 237 336 48" stroke="#756445" stroke-width="98" fill="none" stroke-linecap="round"/><path d="M321 198Q440 142 534 100" stroke="#756445" stroke-width="44" fill="none" stroke-linecap="round"/>${fern(342,203,.66)}${fern(459,136,.5)}<path d="M284 250q15-38 34-6q9-18 17-2" stroke="#75a959" stroke-width="17" fill="none"/>${tree(70,365,.53)}</g>`;
  if(type==='water')extra=`${cloud(310,80,1.6)}${drops(218,125)}${fern(270,377,1.25)}${fern(478,377,1.05)}<path d="M0 330Q95 302 181 323Q300 354 421 322Q545 299 720 330V420H0Z" fill="#54b2bd" opacity=".85"/>`;
  if(type==='papallacta')extra=`<path d="M48 319L250 62 441 318Z" fill="#79a8a8"/><path d="M237 320L438 93 669 321Z" fill="#588c8c"/><path d="M217 105L250 62 284 105 258 96Z" fill="#f5ffff"/><path d="M413 127L438 93 465 124 437 117Z" fill="#f5ffff"/>${cloud(230,170,1.3,'#efffff')}${cloud(525,234,1.1,'#e7f5f0')}${fern(121,376,.9)}${fern(540,368,.9)}`;
  if(type==='endemic')extra=`${tree(126,360,.75)}${fern(339,383,1.9)}${tree(619,354,.64)}<g transform="translate(480 168)" fill="#f8dc80" stroke="#ddab61" stroke-width="3"><ellipse cx="-20" cy="-17" rx="23" ry="32" transform="rotate(-35 -20 -17)"/><ellipse cx="20" cy="-17" rx="23" ry="32" transform="rotate(35 20 -17)"/><ellipse cx="-16" cy="13" rx="16" ry="23" transform="rotate(25 -16 13)"/><ellipse cx="16" cy="13" rx="16" ry="23" transform="rotate(-25 16 13)"/><path d="M0-25v65" stroke="#78472f" stroke-width="8"/></g>`;
  if(type==='deforestation')extra=`<g fill="#8c7554" stroke="#6f573c" stroke-width="4"><path d="M155 352v-89h90v89Z"/><ellipse cx="200" cy="261" rx="45" ry="18" fill="#c6ab7d"/><path d="M454 360v-110h105v110Z"/><ellipse cx="506" cy="249" rx="53" ry="20" fill="#c6ab7d"/></g><path d="M310 321l39-95 13 5-39 97" stroke="#845d40" stroke-width="9" fill="none"/><path d="M315 322l36-40" stroke="#7e6446" stroke-width="10"/><g opacity=".7">${cloud(470,85,.9,'#e2d0aa')}</g>`;
  if(type==='care')extra=`${tree(118,354,.72)}${tree(602,352,.76)}<g><path d="M350 370Q339 325 350 259" stroke="#286d46" stroke-width="13" fill="none" stroke-linecap="round"/><ellipse cx="320" cy="286" rx="43" ry="22" fill="#56a66b" transform="rotate(24 320 286)"/><ellipse cx="382" cy="281" rx="44" ry="22" fill="#79bc72" transform="rotate(-22 382 281)"/><ellipse cx="350" cy="246" rx="32" ry="19" fill="#97d76e" transform="rotate(-90 350 246)"/><path d="M253 340Q285 300 350 331Q399 304 450 343" stroke="#a16c4c" stroke-width="24" fill="none" stroke-linecap="round"/></g><circle cx="505" cy="116" r="37" fill="#ffdf7a"/>`;
  const makeFog=type==='papallacta'?`<path d="M0 305Q155 270 280 310Q445 347 720 290" stroke="#efffff" stroke-width="37" opacity=".65" fill="none"/>`:'';
  return `<svg viewBox="0 0 720 405" role="img" aria-label="Ilustración educativa de ${escaped(type)}" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="sky-${type}" x1="0" x2="0" y1="0" y2="1"><stop stop-color="${palette[0]}"/><stop offset="1" stop-color="${palette[1]}"/></linearGradient></defs><rect width="720" height="405" fill="url(#sky-${type})"/><circle cx="612" cy="73" r="50" fill="#fff4ad" opacity=".65"/><path d="M0 280Q120 218 257 284Q370 230 503 278Q627 225 720 261V405H0Z" fill="${palette[2]}"/><path d="M0 323Q100 272 250 320Q378 270 522 314Q634 277 720 294V405H0Z" fill="${palette[3]}"/>${extra}${makeFog}<path d="M0 368Q110 350 211 373T450 374T720 364V405H0Z" fill="#1a694f" opacity="${type==='deforestation'?'.4':'.8'}"/><g opacity=".75" fill="#e1f7c3"><circle cx="35" cy="355" r="5"/><circle cx="88" cy="382" r="4"/><circle cx="644" cy="363" r="5"/><circle cx="682" cy="380" r="4"/></g></svg>`;
}
function updateToolbar(){const best=getBest();document.getElementById('best').classList.toggle('hidden',!best);document.getElementById('best').textContent=`🏆 Récord: ${best}/10`;const ef=document.getElementById('effectsBtn');ef.textContent=state.effects?'🔊 Efectos: sí':'🔇 Efectos: no';ef.setAttribute('aria-pressed',String(state.effects));const mu=document.getElementById('musicBtn');mu.textContent=state.music?'🎵 Música: sí':'🎵 Música: no';mu.setAttribute('aria-pressed',String(state.music));}
function currentAudio(){try{if(!state.soundCtx)state.soundCtx=new (window.AudioContext||window.webkitAudioContext)();if(state.soundCtx.state==='suspended')state.soundCtx.resume();return state.soundCtx}catch(e){return null}}
function tone(freq,duration,kind='sine',volume=.07,delay=0){let ctx=currentAudio();if(!ctx)return;let osc=ctx.createOscillator(),gain=ctx.createGain(),t=ctx.currentTime+delay;osc.type=kind;osc.frequency.setValueAtTime(freq,t);gain.gain.setValueAtTime(.0001,t);gain.gain.exponentialRampToValueAtTime(Math.max(.0002,volume),t+.02);gain.gain.exponentialRampToValueAtTime(.0001,t+duration);osc.connect(gain);gain.connect(ctx.destination);osc.start(t);osc.stop(t+duration+.02)}
function fx(correct){if(!state.effects)return;if(correct){tone(540,.19,'sine',.062);tone(720,.23,'sine',.07,.13);tone(930,.25,'sine',.067,.26)}else{tone(290,.25,'triangle',.055);tone(240,.35,'triangle',.035,.13)}}
function startMusic(){stopMusic();if(!state.music)return;const play=()=>{if(!state.music)return;[196,247,294].forEach((f,i)=>tone(f,.74,'sine',.012,i*.22))};play();state.musicTimer=setInterval(play,4000)}
function stopMusic(){if(state.musicTimer){clearInterval(state.musicTimer);state.musicTimer=null}}
function stopSpeech(){if('speechSynthesis' in window)try{speechSynthesis.cancel()}catch(e){}}
function speakQuestion(){let q=state.pool[state.idx];if(!q)return;if(!('speechSynthesis' in window)){alert('La lectura de voz no está disponible en este navegador. Puedes leer el texto en pantalla.');return}stopSpeech();let u=new SpeechSynthesisUtterance(`${q.q} Opción A: ${q.opts[0]}. Opción B: ${q.opts[1]}. Opción C: ${q.opts[2]}.`);u.lang='es-EC';u.rate=.88;u.pitch=1.05;let voices=speechSynthesis.getVoices();let v=voices.find(v=>v.lang.toLowerCase()==='es-ec')||voices.find(v=>v.lang.toLowerCase().startsWith('es'));if(v)u.voice=v;speechSynthesis.speak(u)}
function setMode(m){state.mode=m;render()}
function render(){updateToolbar();if(state.screen==='home')renderHome();else if(state.screen==='play')renderPlay();else renderResult();}
function renderHome(){app.innerHTML=`<section class="hero" aria-label="Inicio del juego"><div><div class="kicker">🌱 Misión: conocer y proteger la naturaleza</div><h1 class="big-title">¡Explora el <span>bosque mágico!</span></h1><p class="lead">Aprende sobre las <strong>plantas sin semilla del Ecuador</strong> mientras superas 10 estaciones, ganas estrellas y te conviertes en guardián del bosque.</p><div class="name-area"><label for="studentName">Nombre del explorador:</label><input id="studentName" maxlength="35" placeholder="Escribe tu nombre (opcional)" value="${escaped(state.name)}"></div><div class="mode-pick" role="group" aria-label="Elige un modo de juego"><button id="modeLearn" class="mode-choice ${state.mode==='aprender'?'active':''}" type="button" aria-pressed="${state.mode==='aprender'}"><strong>🧠 Modo aprender</strong><small>Con pistas opcionales y explicaciones para estudiar.</small></button><button id="modeTest" class="mode-choice ${state.mode==='evaluacion'?'active':''}" type="button" aria-pressed="${state.mode==='evaluacion'}"><strong>🏅 Modo evaluación</strong><small>Sin pistas; nota final sobre 10 y repaso de errores.</small></button></div><div class="hero-actions"><button id="startBtn" class="btn btn-primary" type="button">▶ Comenzar aventura</button></div><p class="microcopy">✅ 10 preguntas reales del cuestionario · ✅ 3 alternativas por pregunta · ✅ Sin Internet</p></div><div class="hero-art"><div class="art-frame">${forestSvg('intro')}</div><span class="owl-guide" aria-hidden="true">🦉</span><span class="float-label float-a">✨ ¡Gana estrellas!</span><span class="float-label float-b">🌎 ¡Descubre Ecuador!</span></div></section><h2 class="section-title">¿Cómo se juega?</h2><section class="how-cards" aria-label="Instrucciones"><div class="how-card"><span class="how-icon">🧭</span><h3>1. Explora las estaciones</h3><p>Visita 10 ambientes ilustrados y responde una pregunta en cada uno.</p></div><div class="how-card"><span class="how-icon">⭐</span><h3>2. Aprende de cada respuesta</h3><p>Recibe explicaciones sencillas al acertar o equivocarte.</p></div><div class="how-card"><span class="how-icon">🏆</span><h3>3. Consigue tu medalla</h3><p>Descubre tu calificación y practica solo las preguntas difíciles.</p></div></section>`;
  document.getElementById('studentName').addEventListener('input',ev=>state.name=ev.target.value);
  document.getElementById('modeLearn').addEventListener('click',()=>setMode('aprender'));
  document.getElementById('modeTest').addEventListener('click',()=>setMode('evaluacion'));
  document.getElementById('startBtn').addEventListener('click',()=>startGame(false));
}
function startGame(review=false){stopSpeech();document.getElementById('confetti').innerHTML='';state.review=review;state.screen='play';state.idx=0;state.answer=null;state.hintVisible=false;state.entries=[];state.pool=review?PREGUNTAS.filter(q=>state.baseEntries.find(e=>e.n===q.n && !e.correct)):PREGUNTAS.slice();if(!review)state.baseEntries=[];render();window.scrollTo({top:0,behavior:'smooth'});if(state.music)startMusic();}
function answered(e){if(state.answer!==null)return;state.answer=e;let q=state.pool[state.idx],correct=e===q.a;state.entries.push({n:q.n,correct,selected:e});if(!state.review)state.baseEntries=state.entries.slice();fx(correct);renderPlay();}
function next(){stopSpeech();if(state.answer===null)return;if(state.idx+1>=state.pool.length){finish();return}state.idx++;state.answer=null;state.hintVisible=false;render();window.scrollTo({top:0,behavior:'smooth'})}
function finish(){stopSpeech();state.screen=state.review?'reviewResult':'result';if(state.review){state.reviewEntries=state.entries.slice()}else{state.baseEntries=state.entries.slice();saveBest(state.entries.filter(x=>x.correct).length)}render();window.scrollTo({top:0,behavior:'smooth'});if(!state.review && state.baseEntries.filter(x=>x.correct).length>=8)confetti()}
function renderPlay(){let q=state.pool[state.idx],total=state.pool.length,ans=state.answer,done=ans!==null,correct=done&&ans===q.a,score=state.entries.filter(e=>e.correct).length;
 const steps=state.pool.map((p,i)=>{const entry=state.entries.find(e=>e.n===p.n);let cls=i===state.idx?'current':entry?(entry.correct?'correct':'wrong'):'';return `<span class="step ${cls}" title="Estación ${i+1}" aria-label="Estación ${i+1}: ${cls==='correct'?'correcta':cls==='wrong'?'incorrecta':cls==='current'?'actual':'pendiente'}">${entry?(entry.correct?'✓':'×'):i+1}</span>`}).join('');
 const answers=q.opts.map((o,i)=>{let cls=done?(i===q.a?'revealed-right':i===ans?'revealed-wrong':'dim'):'';return `<button class="answer ${cls}" type="button" data-ans="${i}" ${done?'disabled':''} aria-label="Opción ${'ABC'[i]}: ${escaped(o)}"><span class="letter">${'ABC'[i]}</span><span class="wording">${escaped(o)}</span><span class="check">${done&&i===q.a?'✓':done&&i===ans?'×':''}</span></button>`}).join('');
 app.innerHTML=`<section class="game-panel"><div class="panel-header"><strong>${state.review?'🔁 Repaso de errores':state.mode==='aprender'?'📚 Modo aprender':'🏅 Modo evaluación'}</strong><span class="count">Estación ${state.idx+1} de ${total} · ⭐ ${score}</span></div><div class="progress"><div class="bar" style="width:${(state.idx+1)/total*100}%"></div></div><div class="game-content"><div class="steps" aria-label="Progreso de la aventura">${steps}</div><div class="question-grid"><div class="scene">${forestSvg(q.scene)}<span class="owl-guide" aria-hidden="true">🦉</span></div><div class="q-copy"><span class="topic">🌿 ${escaped(q.topic)} · Pregunta ${q.n}</span><h1>${escaped(q.q)}</h1><p>Lee con calma y elige la opción que consideres correcta.</p><div class="q-tools"><button type="button" id="speakBtn" class="tiny-action">🔈 Escuchar pregunta</button>${state.mode==='aprender'&&!done?'<button type="button" id="hintBtn" class="tiny-action">💡 '+(state.hintVisible?'Ocultar pista':'Ver pista')+'</button>':''}</div>${state.hintVisible&&!done?`<div class="hint">💡 <strong>Pista:</strong> ${escaped(q.hint)}</div>`:''}</div></div><div class="answers-heading">Selecciona una respuesta:</div><div class="answers" role="group" aria-label="Respuestas posibles">${answers}</div>${done?`<div class="feedback ${correct?'':'error'}" role="status"><h2>${correct?'🎉 ¡Muy bien! Ganaste una estrella.':'🌱 ¡Buen intento! Aprendamos juntos.'}</h2><p>${escaped(q.info)}</p>${!correct?`<div class="tip">✅ La respuesta correcta es: <strong>${'ABC'[q.a]}. ${escaped(q.opts[q.a])}</strong></div>`:''}</div><div class="next-row"><button id="nextBtn" type="button" class="btn btn-primary">${state.idx+1===total?'🏆 Ver resultados':'Siguiente estación →'}</button></div>`:'<p class="keystroke">También puedes responder con las teclas 1, 2 o 3.</p>'}</div></section>`;
 if(!done)app.querySelectorAll('[data-ans]').forEach(el=>el.addEventListener('click',()=>answered(Number(el.dataset.ans))));
 document.getElementById('speakBtn').addEventListener('click',speakQuestion);
 const hb=document.getElementById('hintBtn');if(hb)hb.addEventListener('click',()=>{state.hintVisible=!state.hintVisible;renderPlay()});
 const nb=document.getElementById('nextBtn');if(nb)nb.addEventListener('click',next);
}
function renderResult(){let base=state.baseEntries,correct=base.filter(e=>e.correct).length,wrong=base.filter(e=>!e.correct),grade=correct>=9?'¡Eres un guardián experto del bosque!':correct>=7?'¡Excelente aventura!':correct>=5?'¡Vas por buen camino!':'¡Cada intento te ayuda a aprender!';let name=state.name.trim()?`<div class="certificate">Explorador(a): <strong>${escaped(state.name.trim())}</strong></div>`:'';
 if(state.screen==='reviewResult'){
  let right=state.reviewEntries.filter(x=>x.correct).length,total=state.reviewEntries.length,left=total-right;
  app.innerHTML=`<section class="results"><div class="result-hero">${left===0?'🌟':'🍃'}</div><h1>${left===0?'¡Excelente repaso!':'¡Sigue practicando!'}</h1><p class="description">En esta ronda respondiste correctamente <strong>${right} de ${total}</strong> preguntas que necesitaban refuerzo.</p><div class="stat-row"><div class="stat"><strong>${right}</strong><span>Recuperadas</span></div><div class="stat"><strong>${left}</strong><span>Por practicar</span></div><div class="stat"><strong>${base.filter(e=>e.correct).length}/10</strong><span>Nota inicial</span></div></div><p class="description">Tu nota de la evaluación original no cambia. Puedes intentarlo otra vez y mejorar tu comprensión.</p><div class="results-actions"><button id="homeBtn" class="btn btn-outline">⌂ Ir al inicio</button>${left?'<button id="againBtn" class="btn btn-primary">↻ Repetir el repaso</button>':'<button id="replayBtn" class="btn btn-primary">▶ Nueva aventura</button>'}</div></section>`;
  document.getElementById('homeBtn').onclick=goHome;const again=document.getElementById('againBtn');if(again)again.onclick=()=>{const pending=new Set(state.reviewEntries.filter(e=>!e.correct).map(e=>e.n));state.pool=PREGUNTAS.filter(q=>pending.has(q.n));state.idx=0;state.entries=[];state.answer=null;state.hintVisible=false;state.review=true;state.screen='play';render()};const replay=document.getElementById('replayBtn');if(replay)replay.onclick=()=>startGame(false);return;
 }
 let msg=wrong.length?`<div class="revision"><strong>📚 Para mejorar, repasa estas preguntas:</strong>${wrong.map(e=>{let q=PREGUNTAS.find(p=>p.n===e.n);return `<div>• Pregunta ${e.n}: ${escaped(q.topic)}</div>`}).join('')}</div>`:'<div class="revision"><strong>🌟 ¡Respondiste todas correctamente!</strong> Puedes practicar de nuevo para confirmar cuánto recuerdas.</div>';
 app.innerHTML=`<section class="results"><div class="result-hero">${correct>=8?'🏆':correct>=5?'🌟':'🌱'}</div><h1>${grade}</h1>${name}<p class="description">Has completado las 10 estaciones de Ciencias Naturales. Cada pregunta vale un punto.</p><div class="result-score"><span class="num">${correct}</span><span class="denom">/ 10</span></div><div class="stat-row"><div class="stat"><strong>${correct}</strong><span>Respuestas correctas</span></div><div class="stat"><strong>${wrong.length}</strong><span>Para reforzar</span></div><div class="stat"><strong>${getBest()}/10</strong><span>Mejor marca</span></div></div>${msg}<div class="results-actions"><button id="homeBtn" class="btn btn-outline">⌂ Volver al inicio</button>${wrong.length?'<button id="reviewBtn" class="btn btn-primary">🔁 Repasar mis errores</button>':'<button id="replayBtn" class="btn btn-primary">▶ Jugar otra vez</button>'}</div></section>`;
 document.getElementById('homeBtn').onclick=goHome;const review=document.getElementById('reviewBtn');if(review)review.onclick=()=>startGame(true);const replay=document.getElementById('replayBtn');if(replay)replay.onclick=()=>startGame(false);
}
function goHome(){stopSpeech();state.screen='home';state.review=false;render();window.scrollTo({top:0,behavior:'smooth'})}
function confetti(){let root=document.getElementById('confetti'),colors=['#ffdb6e','#9ee17b','#82d6bf','#ffffff','#f8ad81'];root.innerHTML=Array.from({length:40},(_,i)=>`<i style="--left:${Math.round(Math.random()*98)}%;--duration:${(2.7+Math.random()*2.3).toFixed(2)}s;--delay:${(Math.random()*.8).toFixed(2)}s;--col:${colors[i%colors.length]};--rot:${Math.round(Math.random()*180)}deg"></i>`).join('');setTimeout(()=>root.innerHTML='',6500)}
document.getElementById('effectsBtn').addEventListener('click',()=>{state.effects=!state.effects;updateToolbar();if(state.effects)fx(true)});
document.getElementById('musicBtn').addEventListener('click',()=>{state.music=!state.music;updateToolbar();state.music?startMusic():stopMusic()});
window.addEventListener('keydown',e=>{if(state.screen!=='play'||e.altKey||e.ctrlKey||e.metaKey||e.target.tagName==='INPUT')return;if(state.answer===null&&['1','2','3'].includes(e.key)){answered(Number(e.key)-1)}else if(state.answer!==null&&e.key==='Enter'){e.preventDefault();next()}});
window.addEventListener('pagehide',()=>{stopMusic();stopSpeech()});
render();
</script>
</body>
